# Build on GitHub's runner and upload the finished output to Vercel, so Vercel spends no build minutes.
# Both projects are connected to this repo with Root Directory set (backend, frontend); the ignoreCommand in
# each folder's vercel.json skips Vercel's own Git builds, so this workflow is the only deploy.
# Order: after Backend CI passes on main, the API goes live first, so a new web build never calls an API that
# is not deployed yet.
# The Vercel CLI runs from the repo root: with Root Directory set on the project, it finds the app folder itself.
# Needs repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_API, VERCEL_PROJECT_ID_WEB, DATABASE_URL.
name: vercel
on:
  workflow_run:
    workflows: [Backend]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: { group: vercel-production, cancel-in-progress: false }
permissions: { contents: read }
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  # retries any failure, incl. a brief 404 while the domain switches to the new deployment
  SMOKE: curl --fail --silent --show-error --max-time 20 --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null

jobs:
  api:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --global vercel@52.2.1
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      # The deploy migrates Neon itself, before the new API goes live. The old API keeps serving until
      # the deploy finishes, so a migration must keep it working: add columns and tables, don't rename or
      # drop them in the same release. Only code on main migrates production; a manual run from another
      # branch skips this and only checks.
      # DATABASE_URL is a GitHub Actions secret (Neon connection string): Vercel won't return its copy to the CLI.
      # Migrations need Neon's direct connection: its pooled host is the direct one plus "-pooler".
      - name: Migrate the production database
        if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Repo secret DATABASE_URL is not set (gh secret set DATABASE_URL)"; exit 1; fi
          DATABASE_URL="${DATABASE_URL/-pooler/}" uv run alembic upgrade head
      # Refuse to deploy code whose newest migration isn't on the database: it would 500 on any query touching
      # the new schema. Read-only: `alembic current` only selects from alembic_version.
      - name: Check the production database is migrated
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Repo secret DATABASE_URL is not set (gh secret set DATABASE_URL)"; exit 1; fi
          heads=$(uv run alembic heads | awk '{print $1}' | sort)
          current=$(uv run alembic current | awk '{print $1}' | sort)
          echo "code head(s): $heads"
          echo "database at:  ${current:-<none>}"
          if [ "$heads" != "$current" ]; then
            echo "::error::Production database is at '${current:-none}' but the code needs '$heads'. Deploys from main migrate it; from another branch, run 'uv run alembic upgrade head' against Neon by hand (README, Production database commands), then re-run this workflow."
            exit 1
          fi
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Smoke test
        run: $SMOKE https://finance-api.virajdomadia.com/api/health

  web:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run lint && npm test
        working-directory: frontend
      - run: npm install --global vercel@52.2.1
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Smoke test
        run: $SMOKE https://finance.virajdomadia.com/login
