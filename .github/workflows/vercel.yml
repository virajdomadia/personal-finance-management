# Build on GitHub's runner and upload the finished output to Vercel, so Vercel spends no build minutes.
# Both vercel.json files set ignoreCommand, which stops Vercel's own Git builds; this workflow is the only deploy.
# Order: after Backend CI passes on main, the API goes live first, so a new web build never calls an API that
# is not deployed yet.
# Needs repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_API, VERCEL_PROJECT_ID_WEB.
name: vercel
on:
  workflow_run:
    workflows: [Backend]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: { group: vercel-production, cancel-in-progress: false }
permissions: { contents: read }
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  api:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --global vercel@52.2.1
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Smoke test
        run: curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 5 https://finance-api.virajdomadia.com/api/health

  web:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm test
      - run: npm install --global vercel@52.2.1
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Smoke test
        run: curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 5 -o /dev/null https://finance.virajdomadia.com/login
