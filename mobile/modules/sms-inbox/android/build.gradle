plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smsinbox'
version = '1.0.0'

android {
  namespace "expo.modules.smsinbox"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // HeadlessJsTaskService, for reading an arrived SMS while the app is in the background.
  implementation 'com.facebook.react:react-android'
}
